name: Pipeline SaludNexa Peru IaC

run-name: ${{ github.actor }} esta ejecutando el pipeline de SaludNexa Peru

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    Validar-Terraform:
        runs-on: ubuntu-latest
        steps:
            - name: Validar codigo de Terraform
              run: |
                echo "Ejecutando terraform fmt -check -recursive"
                echo "Ejecutando terraform init -backend=false y terraform validate en envs/dev"

    Plan-Terraform:
        runs-on: ubuntu-latest
        needs: Validar-Terraform
        steps:
            - name: Generar plan de Terraform
              run: |
                echo "Ejecutando terraform init y terraform plan -out=tfplan en envs/dev"
                echo "Variables: TF_VAR_aws_region=sa-east-1 y secrets AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY"

    Aplicar-Terraform:
        runs-on: ubuntu-latest
        needs: Plan-Terraform
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Aplicar infraestructura en AWS
              run: |
                echo "Ejecutando terraform apply tfplan en envs/dev"
                echo "Terraform crea la red, el balanceador, la base de datos y los servidores en AWS"

    Configurar-Ansible:
        runs-on: ubuntu-latest
        needs: Aplicar-Terraform
        steps:
            - name: Ejecutar playbook de Ansible
              run: |
                echo "Ejecutando ansible-playbook -i inventory/dev.ini site.yml --check (modo plan)"
                echo "Ansible configura los servicios de citas, usuarios, pagos y teleconsulta en los servidores"